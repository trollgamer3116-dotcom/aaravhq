<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aarav HQ</title>
<meta name="theme-color" content="#1a1240">
<meta name="description" content="Aarav HQ: focus timer, goals and music.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aarav HQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="mesh" aria-hidden="true"><div class="blobs"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div><div class="grain"></div></div>
<header class="top">
  <div class="brand"><img src="icons/icon-192.png" alt=""><span>Aarav <b>HQ</b></span></div>
  <div class="pill" id="streakPill">🔥 0</div>
</header>
<main id="view" class="view"></main>
<nav class="dock" id="dock">
  <a href="#home" data-t="home"><span>🏠</span><em>Home</em></a>
  <a href="#focus" data-t="focus"><span>⏱️</span><em>Focus</em></a>
  <a href="#goals" data-t="goals"><span>✅</span><em>Goals</em></a>
  <a href="#music" data-t="music"><span>🎧</span><em>Music</em></a>
  <a href="#stats" data-t="stats"><span>📊</span><em>Stats</em></a>
  <a href="#settings" data-t="settings"><span>⚙️</span><em>More</em></a>
</nav>
<div id="ytWrap" class="ytwrap off"><div id="ytPlayer"></div></div>
<div id="mini" class="mini hidden" role="region" aria-label="Mini player">
  <img id="miniThumb" alt="" src="icons/icon-192.png"><div class="mt"><b id="miniTitle">Nothing playing</b><span id="miniSub">Aarav HQ Radio</span></div>
  <button id="mPrev" aria-label="Previous">⏮</button><button id="mPlay" class="pp" aria-label="Play/Pause">▶</button><button id="mNext" aria-label="Next">⏭</button>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
