<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aarav HQ</title>
<meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<script>try{var t=(JSON.parse(localStorage.getItem("aaravhq:v1")||"{}").settings||{}).theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;else if(matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.dataset.theme="light"}catch(e){}</script>
<meta name="description" content="Aarav HQ: focus timer, goals and music.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aarav HQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="mesh" aria-hidden="true"><div class="glow"></div></div>
<header class="top">
  <div class="brand"><img src="icons/icon-192.png" alt=""><span>Aarav <b>HQ</b></span></div>
  <div class="tops"><div class="pill" id="streakPill">0</div><button class="iconbtn" id="themeBtn" aria-label="Theme" title="Theme">◐</button><button class="iconbtn acc" id="qcBtn" aria-label="Quick capture" title="Quick capture">+</button></div>
</header>
<main id="view" class="view"></main>
<nav class="dock" id="dock">
  <a href="#home" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><em>Home</em></a>
  <a href="#plan" data-t="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><em>Plan</em></a>
  <a href="#focus" data-t="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg><em>Focus</em></a>
  <a href="#music" data-t="music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><em>Music</em></a>
  <a href="#more" data-t="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><em>More</em></a>
</nav>
<div id="ytWrap" class="ytwrap off"><div id="ytPlayer"></div></div>
<div id="mini" class="mini hidden" role="region" aria-label="Mini player">
  <img id="miniThumb" alt="" src="icons/icon-192.png"><div class="mt"><b id="miniTitle">Nothing playing</b><span id="miniSub">Aarav HQ Radio</span></div>
  <button id="mPrev" aria-label="Previous"><svg viewBox="0 0 24 24" class="gi"><path d="M6 5v14M19 5 9 12l10 7z"/></svg></button><button id="mPlay" class="pp" aria-label="Play/Pause"><svg viewBox="0 0 24 24" class="gi f"><path d="M7 4.5v15l12.5-7.5z"/></svg></button><button id="mNext" aria-label="Next"><svg viewBox="0 0 24 24" class="gi"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet" role="dialog" aria-label="Quick capture">
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Quick capture</h2><div class="seg" id="qcSeg"><button data-k="goal" class="on">Goal</button><button data-k="note">Note</button></div></div>
  <form id="qcForm"><textarea id="qcText" placeholder="What's on your mind?" rows="3"></textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn ghost" id="qcCancel">Cancel</button><button class="btn pri">Save</button></div></form>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
