<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HQ · Responsive QA</title><style>body{margin:0;background:#111827;color:#eff5ff;font:14px system-ui}header{position:sticky;top:0;z-index:2;background:#111827;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:9px;border-radius:10px;background:#25314a;color:inherit;border:1px solid #556078}main{padding:20px;display:flex;justify-content:center}iframe{border:1px solid #61718d;border-radius:24px;width:390px;height:844px;flex:none;background:#080b17}p{margin:0}#issues{font-size:12px;color:#d0dcf1;max-width:520px;max-height:68px;overflow:auto;white-space:pre-wrap}</style><header><b>HQ / responsive QA</b><label>Width <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option></select></label><label>Height <select id="height"><option>568</option><option>667</option><option selected>844</option><option>932</option></select></label><label>Page <select id="page"><option>home</option><option>more</option><option>vault</option><option>browse</option><option>routines</option><option>play</option><option>notes</option><option>cal</option><option>news</option><option>music</option><option>settings</option></select></label><button id="audit">Audit sizing</button><button id="renderTest">Test scroll rendering</button><p id="issues" role="status">Chrome viewport testing; this does not emulate Safari or touch hardware.</p></header><main><iframe id="phone" title="HQ mobile viewport" src="../index.html?build=40#home"></iframe></main><script>
const phone=document.getElementById('phone'),width=document.getElementById('width'),height=document.getElementById('height'),page=document.getElementById('page'),audit=document.getElementById('audit'),issues=document.getElementById('issues');width.onchange=()=>phone.style.width=width.value+'px';height.onchange=()=>phone.style.height=height.value+'px';page.onchange=()=>phone.contentWindow.location.hash='#'+page.value;audit.onclick=()=>{const d=phone.contentDocument,w=phone.contentWindow,els=[...d.querySelectorAll('#view button,#view input,#view select,#view textarea,#view h1,#view h2,#view h3,#view .ptitle,#dock,#top button,#top .brand,#gsheet.on,#gsheet.on input,#gsheet.on textarea,#gsheet.on select,#gsheet.on button')];const bad=els.filter(e=>{const s=w.getComputedStyle(e),r=e.getBoundingClientRect();let p=e.parentElement;while(p&&p!==d.body){const ps=w.getComputedStyle(p);if(['auto','scroll'].includes(ps.overflowX)&&p.scrollWidth>p.clientWidth+2)return false;p=p.parentElement}return r.width&&s.visibility!=='hidden'&&s.display!=='none'&&(r.right>w.innerWidth+2||r.left < -2)}).map(e=>({element:e.id||e.className,text:e.textContent.trim().slice(0,65),width:Math.round(e.getBoundingClientRect().width)}));issues.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],page:d.body.dataset.view,documentWidth:d.documentElement.scrollWidth,barOverflow:d.querySelector('.bar').scrollWidth>d.querySelector('.bar').clientWidth+2,overflow:bad},null,2)};

document.getElementById('renderTest').onclick=async()=>{const button=document.getElementById('renderTest');button.disabled=true;const w=phone.contentWindow,frames=[],tasks=[];let observer;try{observer=new w.PerformanceObserver(list=>tasks.push(...list.getEntries().map(e=>Math.round(e.duration))));observer.observe({type:'longtask',buffered:false})}catch(_){}const start=w.performance.now();let last=start;issues.textContent='Scrolling for 5 seconds…';await new Promise(done=>{function sample(now){frames.push(now-last);last=now;const max=Math.max(0,phone.contentDocument.documentElement.scrollHeight-w.innerHeight);w.scrollTo(0,max*(.5-.5*Math.cos(Math.min(1,(now-start)/5000)*Math.PI*2)));if(now-start<5000)w.requestAnimationFrame(sample);else done()}w.requestAnimationFrame(sample)});observer?.disconnect();const sorted=frames.slice(1).sort((a,b)=>a-b);issues.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],page:phone.contentDocument.body.dataset.view,frames:frames.length,p95FrameMs:Math.round(sorted[Math.floor(sorted.length*.95)]||0),framesOver50ms:frames.filter(t=>t>50).length,longTasksMs:tasks,note:'Chrome test environment, not an iPhone benchmark'},null,2);button.disabled=false};
</script></html>
